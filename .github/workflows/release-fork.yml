name: Release fork

# Publishes a fork release: upstream's version plus this fork's counter
# (0.1.39-mono.1). Unsigned - no Apple certificate - so macOS needs a
# right-click Open once and Windows shows SmartScreen. Artifacts and the
# updater manifest live on the fork's GitHub Releases, so the in-app updater
# only ever sees fork builds and never replaces them with upstream's.
#
# Upstream's own Release workflow is disabled in this fork (it requires Apple
# and R2 secrets), which is why a v* tag reaches this workflow alone.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.39-mono.2. Empty = next counter on the current upstream base."
        required: false

concurrency:
  group: release-fork
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Public half of the fork's updater key; the private half is a repository secret.
  UPDATER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDczQjYyM0Q2OTI2RjlDRjkKUldUNW5HK1MxaU8yY3doUGtkOGppTGFqKzRhUWI3T2JTL2ZvVmJHaDFkRzFLSUtMQkViRHBqRFAK
  UPDATER_ENDPOINT: https://github.com/suiramdev/monocode/releases/latest/download/latest.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: plan
        name: Bump version and tag
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./src-tauri/tauri.conf.json').version.replace(/-mono\..*$/, '')")
          if [ -n "$REQUESTED" ]; then
            case "$REQUESTED" in
              [0-9]*.[0-9]*.[0-9]*-mono.[0-9]*) VERSION="$REQUESTED" ;;
              *) echo "::error::version must look like 0.1.39-mono.2"; exit 1 ;;
            esac
          else
            N=1
            while git rev-parse -q --verify "refs/tags/v$BASE-mono.$N" >/dev/null; do
              N=$((N + 1))
            done
            VERSION="$BASE-mono.$N"
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          npm run set-version -- "$VERSION"
          node - "$VERSION" "$BASE" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const [version, base] = process.argv.slice(2);
          const text = readFileSync("CHANGELOG.md", "utf8");
          if (text.includes(`\n## [${version}]`)) process.exit(0);
          const date = new Date().toISOString().slice(0, 10);
          const entry = `## [${version}] - ${date}\n\n### Added\n\n- Fork release of upstream ${base}.\n\n`;
          writeFileSync(
            "CHANGELOG.md",
            text.replace("## [Unreleased]\n\n", `## [Unreleased]\n\n${entry}`),
          );
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $VERSION"
          # The bump lands on the tag only. Keeping it off `main` leaves the
          # version fields exactly as upstream wrote them, so the next upstream
          # release merges without a conflict in four files.
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Write updater config
        run: |
          node -e '
            require("node:fs").writeFileSync(
              process.env.RUNNER_TEMP + "/tauri.release.conf.json",
              JSON.stringify({
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: { pubkey: process.env.UPDATER_PUBKEY, endpoints: [process.env.UPDATER_ENDPOINT] } },
              }),
            );
          '
      - name: Build macOS bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"
      - name: Stage macOS bundles
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp target/release/bundle/macos/*.app.tar.gz release-artifacts/
          cp target/release/bundle/macos/*.app.tar.gz.sig release-artifacts/
          cp target/release/bundle/dmg/*.dmg release-artifacts/
          ls -la release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: release-artifacts/
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/install-linux-deps-debian.sh
      - run: npm ci
      - name: Build Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build:linux
      - name: Stage Linux packages
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp target/release/bundle/deb/*.deb release-artifacts/
          cp target/release/bundle/appimage/*.AppImage release-artifacts/
          ls -la release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Write updater config
        run: |
          node -e '
            require("node:fs").writeFileSync(
              process.env.RUNNER_TEMP + "/tauri.release.conf.json",
              JSON.stringify({
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: { pubkey: process.env.UPDATER_PUBKEY, endpoints: [process.env.UPDATER_ENDPOINT] } },
              }),
            );
          '
      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\tauri.release.conf.json"
      - name: Stage Windows packages
        run: |
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" "release-artifacts/"
          Copy-Item "target/release/bundle/nsis/*.exe.sig" "release-artifacts/"
          Get-ChildItem release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: [prepare, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build updater manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la artifacts
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const base = `https://github.com/${process.env.REPO}/releases/download/v${version}`;
          const files = fs.readdirSync("artifacts");
          const find = (test) => {
            const hit = files.find(test);
            if (!hit) throw new Error(`missing artifact: ${test}`);
            return hit;
          };
          const tar = find((f) => f.endsWith(".app.tar.gz"));
          const exe = find((f) => f.endsWith("-setup.exe"));
          const sig = (name) => fs.readFileSync(`artifacts/${name}.sig`, "utf8").trim();
          fs.writeFileSync(
            "latest.json",
            JSON.stringify(
              {
                version,
                notes: `MonoCode ${version}`,
                pub_date: new Date().toISOString(),
                platforms: {
                  "darwin-aarch64": { signature: sig(tar), url: `${base}/${tar}` },
                  "windows-x86_64": { signature: sig(exe), url: `${base}/${exe}` },
                },
              },
              null,
              2,
            ) + "\n",
          );
          NODE
          cat latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MonoCode $VERSION" \
            --notes "Fork build with the GitLab inbox provider and worktree sessions. See CHANGELOG.md. Unsigned: on macOS open it once with right-click > Open." \
            latest.json artifacts/*
