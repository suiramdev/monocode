name: Sync fork

# Keeps this fork's `main` current with upstream by merging, not fast-forwarding:
# `main` carries the fork's own feature merges, so `gh repo sync` would refuse it.
# Feature branches are left alone - rebasing them would rewrite pushed history.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-fork
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main into main
        env:
          UPSTREAM: https://github.com/hardbeat920/monocode.git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          # Upstream tags stay out: a fetched v* tag would fire the release build.
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains upstream/main ($(git rev-parse --short upstream/main))."
            exit 0
          fi
          git merge --no-edit -m "Merge upstream/main" upstream/main
          git push origin HEAD:main
          echo "Merged upstream/main ($(git rev-parse --short upstream/main))."
